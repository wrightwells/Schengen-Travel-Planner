name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.16'
          python-version: '3.12'
      - name: Check API
        working-directory: api
        run: |
          uv sync --frozen
          uv run pytest -q
          uv run ruff check .
          uv run ruff format --check .
      - name: Compile and check web
        working-directory: web
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Validate release configuration
        env:
          DB_PASSWORD: release-config-validation-only
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "v$(node -p "require('./web/package.json').version")" = "$RELEASE_TAG"
          grep -q "planner-web:$RELEASE_TAG" compose.example.yaml
          grep -q "planner-api:$RELEASE_TAG" compose.example.yaml
          grep -q "planner-web:$RELEASE_TAG" compose.yaml
          grep -q "planner-api:$RELEASE_TAG" compose.yaml
          docker compose -f compose.example.yaml config --quiet
          docker compose -f compose.yaml config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish API
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          platforms: linux/amd64
          tags: ghcr.io/wrightwells/schengen-travel-planner-api:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build and publish web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          platforms: linux/amd64
          tags: ghcr.io/wrightwells/schengen-travel-planner-web:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tar -czf "schengen-web-$RELEASE_TAG.tar.gz" -C web/dist .
          title="version ${RELEASE_TAG#v} web"
          if [ "$RELEASE_TAG" = v1.0.0 ]; then title="version 1 web"; fi
          gh release create "$RELEASE_TAG" \
            --verify-tag --title "$title" --generate-notes \
            compose.yaml compose.example.yaml .env.example tailscale/serve.json \
            "schengen-web-$RELEASE_TAG.tar.gz"
